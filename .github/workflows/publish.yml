name: Publish to npm

# Publishes the current package.json version to the npm registry.
# Triggered by:
#   - pushing a v* tag (normal release flow)
#   - manual dispatch (Actions page / API), e.g. to publish an already
#     versioned but not-yet-on-npm release
# Requires the repository secret NPM_TOKEN (a granular npm token with
# Read and write on packages).

on:
  workflow_dispatch:
  push:
    tags: ['v*']

# Cancel superseded runs on the same ref.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.5

      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      # The Edge theme test needs Windows; everything else must pass here.
      - name: Test
        run: pnpm exec vitest run --exclude tests/browser-theme.test.ts

      - name: Pack
        run: pnpm pack --pack-destination dist

      # Verify the exact tarball that will be published, then publish that file.
      - name: Verify package
        run: pnpm test:package

      - name: Publish verified tarball
        run: |
          PKG=$(node -p "require('./package.json').name")
          VER=$(node -p "require('./package.json').version")
          npm publish "dist/${PKG}-${VER}.tgz" --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
