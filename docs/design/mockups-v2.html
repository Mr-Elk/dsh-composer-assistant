<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>输入助手 · 设计图 v2</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  html {
    --page: #ececeb;
    --surface: #ffffff;
    --surface-2: #f7f7f8;
    --text: #0f1115;
    --muted: #61666b;
    --faint: #8b9096;
    --line: rgba(0, 0, 0, .1);
    --line-strong: rgba(0, 0, 0, .16);
    --hover: rgba(0, 0, 0, .04);
    --accent: #4176e6;
    --accent-solid: #4176e6;
    --accent-soft: #e8effc;
    --chip: #f4f4f5;
    --seg-on: #ffffff;
    --knob: #ffffff;
    --shadow: 0 0 0 .5px rgba(0, 0, 0, .06), 0 12px 32px rgba(0, 0, 0, .10);
    --shadow-pop: 0 0 0 .5px rgba(0, 0, 0, .04), 0 3px 8px rgba(0, 0, 0, .04), 0 0 20px rgba(0, 0, 0, .05);
    --shadow-knob: 0 1px 2px rgba(0, 0, 0, .2);
  }
  html[data-theme="dark"] {
    --page: #141415;
    --surface: #232324;
    --surface-2: #1c1c1d;
    --text: #f3f4f6;
    --muted: #adb2b8;
    --faint: #8b9096;
    --line: rgba(255, 255, 255, .12);
    --line-strong: rgba(255, 255, 255, .2);
    --hover: rgba(255, 255, 255, .06);
    --accent: #7aaaff;
    --accent-solid: #4c88e4;
    --accent-soft: #26324a;
    --chip: #2c2c2e;
    --seg-on: #3a3a3c;
    --knob: #ffffff;
    --shadow: 0 0 0 .5px rgba(0, 0, 0, .45), 0 12px 32px rgba(0, 0, 0, .45);
    --shadow-pop: 0 0 0 .5px rgba(0, 0, 0, .3), 0 3px 8px rgba(0, 0, 0, .3), 0 0 20px rgba(0, 0, 0, .35);
    --shadow-knob: 0 1px 2px rgba(0, 0, 0, .35);
  }
  body {
    background: var(--page);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .stage { padding: 28px; }
  .cap { margin: 0 0 12px; font-size: 12px; line-height: 18px; color: var(--muted); letter-spacing: .02em; }

  /* ---------- settings ---------- */
  .panel {
    width: 784px;
    padding: 28px 32px 24px;
    background: var(--surface);
    border-radius: 16px;
    box-shadow: var(--shadow);
  }
  .intro { margin: 0 0 4px; font-size: 13px; line-height: 20px; color: var(--muted); }
  .group { margin-top: 28px; }
  .group:first-of-type { margin-top: 20px; }
  .group > h3 { margin: 0 0 8px; font-size: 14px; line-height: 22px; font-weight: 500; color: var(--text); }
  .rows { display: flex; flex-direction: column; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 24px; min-height: 74px; padding: 16px 0; }
  .row + .row { border-top: 1px solid var(--line); }
  .row-main { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
  .row-main b { font-size: 14px; line-height: 22px; font-weight: 400; color: var(--text); }
  .row-main small { font-size: 13px; line-height: 20px; font-weight: 400; color: var(--muted); }
  .control { display: flex; align-items: center; gap: 8px; flex: 0 0 auto; }
  .select, .input {
    display: inline-flex; align-items: center; justify-content: space-between; gap: 8px;
    min-height: 28px; padding: 0 9px;
    border: 1px solid var(--line); border-radius: 8px; background: var(--surface);
    color: var(--muted); font-size: 13px; line-height: 20px; font-weight: 500;
  }
  .select { min-width: 112px; }
  .input { width: 180px; }
  .input.num { width: 96px; justify-content: flex-end; font-variant-numeric: tabular-nums; }
  .input.is-placeholder { color: var(--faint); font-weight: 400; }
  .switch {
    position: relative; flex: 0 0 auto; width: 36px; height: 20px; border-radius: 999px;
    background: var(--accent);
  }
  .switch::after {
    content: ""; position: absolute; top: 2px; left: 18px; width: 16px; height: 16px;
    border-radius: 50%; background: var(--knob); box-shadow: var(--shadow-knob);
  }
  .switch.off { background: var(--line-strong); }
  .switch.off::after { left: 2px; }
  .field-block { padding-top: 14px; }
  .textarea {
    margin-top: 8px; min-height: 64px; padding: 8px 10px;
    border: 1px solid var(--line); border-radius: 8px; background: var(--surface);
    color: var(--faint); font-size: 13px; line-height: 20px;
  }
  .actions {
    display: flex; align-items: center; gap: 10px;
    margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--line);
  }
  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    height: 28px; padding: 0 12px; border-radius: 8px;
    background: transparent; color: var(--muted); font-size: 13px; line-height: 20px;
  }
  .btn.primary { height: 30px; padding: 0 14px; background: var(--accent-solid); color: #fff; font-weight: 500; }
  .dirty { margin-left: 2px; font-size: 12px; color: var(--faint); }

  /* ---------- menu ---------- */
  .menu {
    width: 360px; padding: 4px; border-radius: 16px;
    background: var(--surface); box-shadow: var(--shadow-pop);
  }
  .menu-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; padding: 8px 8px 6px; }
  .menu-head b { font-size: 13px; line-height: 20px; font-weight: 600; }
  .menu-head span { font-size: 12px; line-height: 18px; color: var(--muted); }
  .qrow {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    width: 100%; height: 34px; padding: 0 8px; border-radius: 10px;
    font-size: 13px; line-height: 20px; color: var(--text);
  }
  .qsum { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: var(--muted); }
  .sep { height: 1px; margin: 4px 8px; background: var(--line); }
  .item {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    width: 100%; min-height: 34px; padding: 0 8px; border-radius: 10px;
    font-size: 13px; line-height: 20px; color: var(--text); text-align: left;
  }
  .item .right { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: var(--muted); }
  .sect { display: flex; align-items: center; justify-content: space-between; padding: 8px 8px 2px; font-size: 12px; line-height: 18px; color: var(--muted); }
  .note { margin: 0; padding: 2px 8px 6px; font-size: 12px; line-height: 18px; color: var(--muted); }
  .panel .note { margin: 0 0 2px; padding: 0; font-size: 13px; line-height: 20px; }
  .about { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 2px 8px 4px; }
  .about .version { font-size: 13px; line-height: 20px; color: var(--muted); }
  .about .link { font-size: 13px; line-height: 20px; color: var(--text); }
  .more { margin: 0; padding: 4px 8px 6px; font-size: 12px; line-height: 18px; color: var(--muted); }

  /* ---------- quick settings ---------- */
  .quick { padding: 0 0 2px; }
  .quick-head { display: flex; align-items: center; justify-content: space-between; padding: 6px 8px 2px; }
  .quick-head b { font-size: 12px; line-height: 18px; font-weight: 500; color: var(--muted); }
  .quick-head span { display: inline-flex; align-items: center; gap: 3px; font-size: 12px; color: var(--muted); }
  .qline { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 36px; padding: 4px 8px; }
  .qline label { font-size: 13px; line-height: 20px; color: var(--text); }
  .seg { display: inline-flex; align-items: center; gap: 2px; height: 28px; padding: 2px; border-radius: 8px; background: var(--chip); }
  .seg span {
    display: inline-flex; align-items: center; justify-content: center;
    height: 24px; padding: 0 9px; border-radius: 6px;
    font-size: 12px; line-height: 18px; color: var(--muted);
  }
  .seg span.on { background: var(--seg-on); color: var(--text); font-weight: 500; box-shadow: 0 1px 2px rgba(0, 0, 0, .08); }

  /* ---------- composer ---------- */
  .composer {
    width: 720px; padding: 12px 0 10px;
    background: var(--surface); border-radius: 20px; box-shadow: var(--shadow);
  }
  .draft { padding: 2px 18px 14px; font-size: 15px; line-height: 26px; }
  .ghost { color: var(--faint); }
  .keycap {
    display: inline-block; margin-left: 6px; padding: 0 5px;
    border: 1px solid var(--line); border-radius: 5px;
    font-size: 10px; line-height: 15px; color: var(--muted); vertical-align: 1px;
  }
  .bar { display: flex; align-items: center; gap: 4px; padding: 0 10px; }
  .plus {
    display: inline-flex; align-items: center; justify-content: center;
    width: 30px; height: 30px; border-radius: 50%;
    background: var(--chip); color: var(--muted); font-size: 18px; line-height: 1;
  }
  .tool {
    display: inline-flex; align-items: center; gap: 5px;
    height: 28px; padding: 0 7px; border-radius: 8px;
    color: var(--muted); font-size: 13px; line-height: 20px;
  }
  .tool.icon-only { padding: 0 5px; }
  .spacer { flex: 1; }
  .model { display: inline-flex; align-items: center; gap: 4px; margin-left: 2px; font-size: 13px; color: var(--muted); }
  .send {
    display: inline-flex; align-items: center; justify-content: center;
    width: 34px; height: 34px; border-radius: 50%;
    background: var(--accent-solid); color: #fff;
  }

  /* ---------- feedback ---------- */
  .sheet { width: 720px; }
  .demo + .demo { margin-top: 30px; }
  .demo-label { margin: 0 0 10px; font-size: 12px; line-height: 18px; color: var(--muted); }
  .candidate {
    display: flex; align-items: center; gap: 6px;
    width: 560px; padding: 6px 6px 6px 12px;
    background: var(--surface); border-radius: 16px; box-shadow: var(--shadow-pop);
  }
  .candidate-text { flex: 1; font-size: 13px; line-height: 20px; }
  .chip-btn { height: 28px; padding: 0 8px; border-radius: 8px; font-size: 13px; line-height: 20px; color: var(--muted); }
  .chip-btn.accept { color: var(--accent); background: var(--accent-soft); font-weight: 500; }
  .close { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 8px; color: var(--muted); font-size: 16px; }
  .mini-composer {
    display: flex; align-items: flex-start;
    width: 720px; min-height: 96px; margin-top: 12px; padding: 14px 18px;
    background: var(--surface); border-radius: 20px; box-shadow: var(--shadow);
  }
  .mini-draft { font-size: 15px; line-height: 26px; color: var(--text); }
  .notice {
    display: flex; align-items: flex-start; gap: 8px;
    width: max-content; max-width: 440px; margin-bottom: 8px; padding: 8px 12px;
    background: var(--surface); border-radius: 12px; box-shadow: var(--shadow-pop);
    font-size: 13px; line-height: 20px;
  }
  .notice svg { flex: 0 0 auto; margin-top: 3px; color: var(--muted); }
  .notice.error svg { color: #d9534f; }
  .notice-row { display: flex; flex-direction: column; align-items: flex-start; }
  .notice-row + .mini-composer { margin-top: 12px; }
</style>
</head>
<body>
<script>
  const sparkle = `<svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M8 1.7l1.32 3.78 3.78 1.32-3.78 1.32L8 11.9 6.68 8.12 2.9 6.8l3.78-1.32L8 1.7Z" fill="currentColor" opacity=".9"/><path d="M12.7 10.5l.55 1.55 1.55.55-1.55.55-.55 1.55-.55-1.55-1.55-.55 1.55-.55.55-1.55Z" fill="currentColor" opacity=".5"/></svg>`;
  const chevron = `<svg width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true"><path d="M3 4.5 6 7.5 9 4.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  const chevronUp = `<svg width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true"><path d="M3 7.5 6 4.5 9 7.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  const send = `<svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M8 12.5V3.5M4.5 7 8 3.5 11.5 7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  const info = `<svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="8" cy="8" r="6.2" stroke="currentColor" stroke-width="1.3"/><path d="M8 7.2v3.1M8 5.3v.1" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>`;
  const alert = `<svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M8 2.3 14 13H2L8 2.3Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><path d="M8 6.2v3M8 11.2v.1" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>`;
  const folder = `<svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true"><rect x="2.2" y="3.6" width="11.6" height="8.8" rx="2" stroke="currentColor" stroke-width="1.2"/><path d="M2.2 6.4h11.6" stroke="currentColor" stroke-width="1.2"/></svg>`;

  const row = (title, hint, control) => `
    <div class="row">
      <span class="row-main"><b>${title}</b>${hint ? `<small>${hint}</small>` : ''}</span>
      <span class="control">${control}</span>
    </div>`;
  const toggle = (title, hint, on = true) => row(title, hint, `<span class="switch ${on ? '' : 'off'}"></span>`);
  const select = (text, width = '') => `<span class="select"${width ? ` style="min-width:${width}"` : ''}>${text}${chevron}</span>`;
  const num = value => `<span class="input num">${value}</span>`;
  const textInput = placeholder => `<span class="input is-placeholder">${placeholder}</span>`;

  const settings = `
    <p class="cap">设置 → 输入助手 · 完整页面（示例值均为默认值）</p>
    <div class="panel">
      <p class="intro">帮助你形成准确、可发送的输入。开关决定要不要这个功能，其余保持默认即可。</p>

      <section class="group">
        <h3>功能</h3>
        <div class="rows">
          ${toggle('提示词优化', '把草稿或选中文字改写成可发送的表达')}
          ${toggle('回复后预测', '助手回复结束后，为空输入框预测下一句')}
          ${toggle('输入续写', '按当前草稿与光标位置继续写')}
        </div>
      </section>

      <section class="group">
        <h3>建议</h3>
        <div class="rows">
          ${row('建议长度', '短更克制，长更完整；超出输入框可见高度时自动改用候选卡', select('标准'))}
          ${row('触发方式', '自动：每轮结束请求一次；手动：只用菜单里的「换一条建议」', select('自动'))}
        </div>
      </section>

      <section class="group">
        <h3>优化</h3>
        <div class="rows">
          ${row('优化强度', '轻度只修表达，深度可重组结构；各档都不新增任务或授权', select('标准优化', '128px'))}
        </div>
      </section>

      <section class="group">
        <h3>辅助模型</h3>
        <p class="note">两项同时留空时跟随输入框模型；辅助调用单独消耗模型用量。</p>
        <div class="rows">
          ${row('提供商', '', textInput('跟随输入框'))}
          ${row('模型', '', textInput('跟随输入框'))}
        </div>
      </section>

      <section class="group">
        <h3>高级</h3>
        <div class="rows">
          ${row('上下文上限', '参与建议的对话上下文字数；越长越完整，也越贵', num('16000'))}
          ${row('建议超时', '5–60 秒；模型较慢时可放宽，超时不会改动草稿', num('15'))}
          ${row('每小时调用上限', '全局上限，只计自动建议；0 表示不限制，手动优化与「换一条」不计入', num('0'))}
          ${row('温度', '0.3 稳定 / 0.7 平衡 / 1.0 发散；越低越保守', num('0.7'))}
        </div>
        <div class="field-block">
          <div class="row-main">
            <b>额外指令</b>
            <small>追加到系统提示词，最多 500 字；例如“用更口语的中文”“不要出现列表”</small>
          </div>
          <div class="textarea">例如：用更口语的中文；不要出现列表；优先给出下一步验证</div>
        </div>
      </section>

      <div class="actions">
        <span class="btn primary">保存设置</span>
        <span class="btn">放弃修改</span>
      </div>
    </div>`;

  const menuTail = `
    <div class="item"><span>保护选中原文</span></div>
    <p class="note">代码、路径和网址自动保护；手动保护在编辑草稿后清除。</p>
    <div class="sep"></div>
    <div class="sect"><span>建议</span></div>
    <div class="item"><span>换一条建议</span></div>
    <div class="item"><span>暂停至下次编辑</span></div>
    <div class="sep"></div>
    <div class="item"><span>本次使用统计</span><span class="right">展示 12 · 采纳 4 ${chevron}</span></div>
    <div class="sep"></div>
    <div class="sect"><span>关于</span></div>
    <div class="about"><span class="version">输入助手 v0.2.0</span><span class="link">检查更新</span></div>
    <p class="note">只查询 npm registry 的版本号；升级需要卸载后在插件管理里重新安装。</p>
    <p class="more">更多设置：DSH 设置 → 输入助手</p>`;

  const menu = `
    <p class="cap">输入框旁 ⌄ 弹窗 · 动作（快捷设置收起）</p>
    <div class="menu">
      <div class="menu-head"><b>输入助手</b><span>采纳后由你发送</span></div>
      <div class="qrow"><span>快捷设置</span><span class="qsum">标准 · 自动 ${chevron}</span></div>
      <div class="sep"></div>
      ${menuTail}
    </div>`;

  const quick = `
    <p class="cap">输入框旁 ⌄ 弹窗 · 快捷设置展开</p>
    <div class="menu">
      <div class="menu-head"><b>输入助手</b><span>采纳后由你发送</span></div>
      <div class="quick">
        <div class="quick-head"><b>快捷设置</b><span>收起 ${chevronUp}</span></div>
        <div class="qline"><label>建议长度</label><span class="seg"><span>短</span><span class="on">标准</span><span>长</span></span></div>
        <div class="qline"><label>触发方式</label><span class="seg"><span class="on">自动</span><span>手动</span></span></div>
        <div class="qline"><label>提示词优化</label><span class="switch"></span></div>
      </div>
      <div class="sep"></div>
      ${menuTail}
    </div>`;

  const composer = `
    <p class="cap">输入框 · 灰字建议（放不下时自动换候选卡）</p>
    <div class="composer">
      <div class="draft">请解释缓存失效<span class="ghost">，以及它对多用户并发的影响。<span class="keycap">Tab</span></span></div>
      <div class="bar">
        <span class="plus">+</span>
        <span class="tool">${folder} 工作区内修改 ${chevron}</span>
        <span class="spacer"></span>
        <span class="tool">${sparkle} 优化</span>
        <span class="tool icon-only">${chevron}</span>
        <span class="model">DeepSeek V4.1 Flash (latest) (CC) max ${chevron}</span>
        <span class="send">${send}</span>
      </div>
    </div>`;

  const feedback = `
    <p class="cap">候选卡与提示气泡</p>
    <div class="sheet">
      <div class="demo">
        <p class="demo-label">候选卡 · 建议在输入框里放不下时</p>
        <div class="candidate">
          <span class="candidate-text">如果缓存失效，多用户并发下容易出现缓存击穿；可以加互斥锁，并给过期时间加一点随机抖动。</span>
          <span class="chip-btn">换一条</span>
          <span class="chip-btn accept">采纳</span>
          <span class="close">×</span>
        </div>
        <div class="mini-composer"><span class="mini-draft">请解释缓存失效</span></div>
      </div>
      <div class="demo">
        <p class="demo-label">提示气泡 · 信息 6 秒自动消失，错误 10 秒；点击或 Esc 立即关闭</p>
        <div class="notice-row">
          <div class="notice info">${info}<span>已暂停建议，下次编辑后恢复</span></div>
          <div class="notice error">${alert}<span>模型输出未正常结束，已保留原稿</span></div>
        </div>
        <div class="mini-composer"><span class="mini-draft">请解释缓存失效</span></div>
      </div>
    </div>`;

  const templates = { settings, menu, quick, composer, feedback };
  const params = new URLSearchParams(location.search);
  const board = params.get('board') || 'settings';
  const theme = params.get('theme') === 'dark' ? 'dark' : 'light';
  document.documentElement.dataset.theme = theme;
  document.body.innerHTML = `<div class="stage">${templates[board] || templates.settings}</div>`;
  document.title = `输入助手 · ${board} · ${theme}`;
</script>
